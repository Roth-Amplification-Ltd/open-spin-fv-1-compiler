name: build

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, id: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, id: linux-arm64 }
          - { runner: macos-15, id: macos-arm64 }
          - { runner: macos-15-intel, id: macos-x86_64 }
          - { runner: windows-2025, id: windows-x86_64 }
          - { runner: windows-11-arm, id: windows-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Qualification
        run: python tools/qualification.py --repo . --build build --expect-version 0.2.0
      - name: Install smoke
        run: cmake --install build --config Release --prefix install-test

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan/UBSan
        run: >-
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
      - name: Qualification under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 tools/qualification.py --repo . --build build-sanitize --expect-version 0.2.0
